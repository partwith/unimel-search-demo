app = "cross-collection-search"
primary_region = "syd"

[build]

[env]
  RAILS_ENV = "production"
  SOLR_URL = "http://localhost:8983/solr/nexus"
  UPSTREAM_URL = "http://localhost:4567/oai"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "180s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/catalog"

[[mounts]]
  source = "nexus_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
